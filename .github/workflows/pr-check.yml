name: PR validation

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Linter
        run: pnpm lint

      - name: Types
        run: pnpm lint:types

      - name: Unit tests
        run: pnpm test

      # pnpm 10 uses the retired legacy audit endpoint, run the audit via pnpm 11 client
      # (no --config.minimumReleaseAge flag: pnpm 10.6.1 dlx does not support it)
      - name: Security
        run: pnpm dlx pnpm@11.0.0-rc.1 --config.manage-package-manager-versions=false audit --audit-level high
